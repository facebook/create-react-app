name: ERP CI

on:
  push:
    branches: [main, claude/erp-phase-1-foundations-9miE5]
    paths:
      - 'erp/**'
  pull_request:
    branches: [main]
    paths:
      - 'erp/**'

jobs:
  php-tests:
    name: PHP Tests (Laravel/Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, xml, curl, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: erp/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('erp/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run Pest tests
        run: php artisan test --stop-on-failure
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: log
          BROADCAST_CONNECTION: log

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint resources/js --ext .ts,.tsx --max-warnings 0
        continue-on-error: true
